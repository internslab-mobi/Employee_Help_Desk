@if (state.showResolveModal()) {
<div class="modal-backdrop" (click)="state.closeResolveModal()">
  <div class="modal-card modal-sm" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title-with-icon">
        <span class="icon-resolve-circle">✓</span>
        <div>
          <h3>Resolve Support Ticket</h3>
          <p class="modal-subtitle">Ticket #{{ state.selectedTicketForResolve()?.ticketNumber }}</p>
        </div>
      </div>
      <button type="button" class="btn-close-modal" (click)="state.closeResolveModal()">&times;</button>
    </div>

    <div class="modal-body">
      <div class="resolve-info-alert">
        <p>Marking this ticket as <strong>RESOLVED</strong> will finalize the SLA resolution clock and notify the employee.</p>
      </div>

      <div class="form-group">
        <label>Resolution Summary / Action Taken <span class="required-star">*</span></label>
        <textarea class="form-control" rows="4" [ngModel]="state.resolutionSummaryInput()"
          (ngModelChange)="state.resolutionSummaryInput.set($event)"
          placeholder="Describe the solution applied or steps taken to resolve the issue..."></textarea>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-outline-cancel" (click)="state.closeResolveModal()">Cancel</button>
      <button type="button" class="btn-action-resolve" [disabled]="state.isSubmittingAction() || !state.resolutionSummaryInput().trim()"
        (click)="confirmResolve()">
        @if (state.isSubmittingAction()) { Resolving... } @else { Mark as Resolved }
      </button>
    </div>
  </div>
</div>
}
