spring:
  application:
    name: help-desk
  cache:
    type: caffeine
    cache-names: errorCodeMappings
    caffeine:
      spec: maximumSize=500
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  datasource:
    url: ${DB_URL:jdbc:mysql://192.168.11.101:3306/Interns_db}
    username: ${db_uname:InternX}
    password: ${db_pass:MobiInterns@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:bob301935@gmail.com}
    password: ${MAIL_PASSWORD:xixltdzykjkbmhhi}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false


helpdesk:
  mail:
    from: ${MAIL_FROM:bob301935@gmail.com}
  sla:
    work-start: "08:30"
    work-end: "17:30"
    scheduler-interval-ms: 60000
    batch-size: ${Scheduler_Batch_Size:50}

report:
  service:
    base-url: ${REPORT_SERVICE_URL:http://localhost:8083}
    connect-timeout-seconds: 5
    read-timeout-seconds: 30


security:
  jwt:
    secret: ${JWT_SECRET:this-is-my-superkey-for-employee-helpdesk}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2700000}

logging:
  level:
    root: INFO
    xyz.mobi.employeehelpdesk: INFO
    xyz.mobi.employeehelpdesk.strategy.routing: DEBUG
    xyz.mobi.employeehelpdesk.scheduler: DEBUG
    xyz.mobi.employeehelpdesk.security: DEBUG
    org.springframework.security: WARN