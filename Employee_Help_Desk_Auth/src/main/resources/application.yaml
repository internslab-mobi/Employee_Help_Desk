spring:
  application:
    name: auth-service
  cache:
    type: caffeine
    cache-names: errorCodeMappings
    caffeine:
      spec: maximumSize=500
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://192.168.11.101:3306/Interns_db}
    username: ${db_uname:InternX}
    password: ${db_pass:MobiInterns@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

helpdesk:
  mail:
    from: ${MAIL_FROM:divyabala615@gmail.com}

security:
  jwt:
    secret: ${JWT_SECRET:this-is-my-superkey-for-employee-helpdesk}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2700000}

logging:
  level:
    root: INFO
    xyz.mobi.Employee_Help_Desk_Auth: DEBUG
    org.springframework.security: WARN
