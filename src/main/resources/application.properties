spring.application.name=helpdesk
# Timezone Configuration
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/project_employee_helpdesk
spring.datasource.username=root
spring.datasource.password=Mohdshahrose@24
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server
server.port=8098

# JWT Configuration
app.jwt.secret=${JWT_SECRET:MySuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForSecurity}
app.jwt.expiration=900000
app.jwt.refresh.expiration=604800000

# Email Configuration

# IMPORTANT: Set environment variables SMTP_USERNAME and SMTP_PASSWORD before running
# Example PowerShell commands:
# $env:SMTP_USERNAME="your-email@gmail.com"
# $env:SMTP_PASSWORD="your-gmail-app-password"
spring.mail.enabled=${EMAIL_ENABLED:true}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:your-email@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# First Login Configuration
app.security.otp-expiration-minutes=10
app.security.temporary-password-length=12

# SpringDoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.packages-to-scan=com.example.helpdesk.controller
springdoc.paths-to-match=/api/**