# ==============================================================================
# Employee Help Desk - Application Configuration
# ==============================================================================

spring:
  application:
    name: helpdesk

  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/project_employee_helpdesk}
    username: ${DB_USERNAME:root}
    password: ${Mohdshahrose@24}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA & Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    database-platform: org.hibernate.dialect.MySQLDialect

  # Database Migrations (Flyway)
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  # Mail / SMTP Configuration
  mail:
    enabled: ${EMAIL_ENABLED:true}
    host: ${MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}
    port: ${MAIL_PORT:${SMTP_PORT:587}}
    username: ${MAIL_USERNAME:${roshiniiizahra2004@gmail.com}}
    password: ${MAIL_PASSWORD:${ufca pmek myqa gmmy}}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Server Port
server:
  port: ${SERVER_PORT:8098}

# Help Desk Application Custom Properties
app:
  jwt:
    secret: ${JWT_SECRET:MySuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForSecurity}
    expiration: ${JWT_EXPIRATION:900000}
    refresh:
      expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  security:
    otp-expiration-minutes: 10
    temporary-password-length: 12

# SpringDoc OpenAPI (Swagger) Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true
    config-url: /v3/api-docs/swagger-config
    url: /v3/api-docs
    try-it-out-enabled: true
  packages-to-scan: com.example.helpdesk.controller
  paths-to-match: /api/**
