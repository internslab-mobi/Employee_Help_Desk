spring:
  application:
    name: help-desk
  cache:
    type: caffeine
    cache-names: errorCodeMappings
    caffeine:
      spec: maximumSize=500
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  datasource:
    url: jdbc:mysql://localhost:3306/finalhelpdesk?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=true
    username: ${db_uname}
    password: ${db_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info


helpdesk:
  mail:
    from: ${MAIL_FROM}
  sla:
    work-start: "08:30"
    work-end: "17:30"
    scheduler-interval-ms: 60000
    batch-size: ${Scheduler_Batch_Size:50}

security:
  jwt:
    secret: ${JWT_SECRET:this-is-my-superkey-for-employee-helpdesk}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2700000}

logging:
  level:
    root: INFO
    xyz.mobi.employeehelpdesk: INFO
    xyz.mobi.employeehelpdesk.strategy.routing: DEBUG
    xyz.mobi.employeehelpdesk.scheduler: DEBUG
    xyz.mobi.employeehelpdesk.security: DEBUG
    org.springframework.security: WARN