spring:
  application:
    name: help-desk
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  datasource:
    url: jdbc:mysql://localhost:3306/help_desk
    username: ${db_uname}
    password: ${db_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info


helpdesk:
  mail:
    from: ${MAIL_FROM}
  sla:
    work-start: "08:30"
    work-end: "17:30"
    scheduler-interval-ms: 60000
    batch-size: 50

security:
  jwt:
    secret: ${JWT_SECRET:default-super-secret-jwt-signing-key-for-development-must-be-at-least-256-bits!}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}